<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1000px;height:420px;overflow:hidden}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",sans-serif;color:#f1f3fa;
background:radial-gradient(700px 420px at 92% 0%,rgba(76,98,200,.42),transparent 62%),radial-gradient(520px 340px at 0% 100%,rgba(120,40,80,.26),transparent 60%),#0d1020;
display:grid;grid-template-columns:1fr 380px;gap:36px;align-items:center;padding:0 48px 0 56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:20px;margin-bottom:20px}
.brand img{width:32px;height:32px;border-radius:8px}
h1{font-size:44px;line-height:1.08;font-weight:800;letter-spacing:-.03em}
h1 span{color:#8197ff}
p{margin-top:14px;font-size:18px;color:#a3abc4;line-height:1.4}
.card{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.45);transform:rotate(1.2deg)}
ul{list-style:none;padding:0;display:grid;gap:8px}
li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.05);font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:14px}
li.bad{background:rgba(255,107,139,.12);border:1px solid rgba(255,107,139,.35)}
.tag{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;font-size:12px;font-weight:750;padding:2px 8px;border-radius:6px;border:1px solid currentColor;white-space:nowrap}
.ok{color:#51cf66}.no{color:#ff6b8b}
</style></head><body>
<div>
  <div class="brand"><img src="../../public/logo.png" alt="">LeakPatrol</div>
  <h1>Your Supabase anon key is <span>fine.</span><br>These aren't.</h1>
  <p>The four real leaks in AI-built Supabase apps, and a 2&#8209;minute check.</p>
</div>
<div class="card">
  <ul>
    <li><span>anon key in browser</span><span class="tag ok">Fine</span></li>
    <li class="bad"><span>RLS turned off</span><span class="tag no">Leak</span></li>
    <li class="bad"><span>service_role in JS</span><span class="tag no">Leak</span></li>
    <li class="bad"><span>public storage bucket</span><span class="tag no">Leak</span></li>
    <li class="bad"><span>view skipping RLS</span><span class="tag no">Leak</span></li>
  </ul>
</div>
</body></html>
